# Adds the cert-manager CA-injection annotation to the openstackclients.client.openstack.org CRD so
# the conversion webhook's clientConfig.caBundle is populated at deploy time.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstackclients.client.openstack.org
  annotations:
    cert-manager.io/inject-ca-from: '{{ .OperatorNamespace }}/openstack-operator-serving-cert'
