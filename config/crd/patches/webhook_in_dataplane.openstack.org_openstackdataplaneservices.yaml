# Enables the conversion webhook for the openstackdataplaneservices.dataplane.openstack.org CRD.
# Stays dormant while the CRD has a single served version; activates automatically
# once a second version is added. Namespace is resolved at deploy time.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstackdataplaneservices.dataplane.openstack.org
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          namespace: '{{ .OperatorNamespace }}'
          name: openstack-operator-webhook-service
          path: /convert
      conversionReviewVersions:
      - v1
