apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 120
# Joint gate for OSPRH-30208 + OSPRH-30209 + OSPRH-30210:
# Assert that the keystone CRD installed by openstack-operator carries the correct
# install-namespace in both the cert-manager annotation and the conversion webhook
# service reference, and that cert-manager has populated the caBundle.
commands:
  - script: |
      set -e
      INSTALL_NS="${NAMESPACE:-openstack-operators}"
      CRD=keystoneapis.keystone.openstack.org

      # 1. inject-ca-from annotation namespace == install namespace (OSPRH-30208)
      ANNO=$(oc get crd $CRD -o jsonpath='{.metadata.annotations.cert-manager\.io/inject-ca-from}')
      ANNO_NS="${ANNO%%/*}"
      if [ "$ANNO_NS" != "$INSTALL_NS" ]; then
        echo "FAIL: inject-ca-from annotation namespace '$ANNO_NS' != install namespace '$INSTALL_NS'"
        exit 1
      fi
      echo "OK: inject-ca-from annotation namespace = $ANNO_NS"

      # 2. conversion webhook service namespace == install namespace (OSPRH-30209)
      SVC_NS=$(oc get crd $CRD -o jsonpath='{.spec.conversion.webhook.clientConfig.service.namespace}')
      if [ "$SVC_NS" != "$INSTALL_NS" ]; then
        echo "FAIL: conversion service namespace '$SVC_NS' != install namespace '$INSTALL_NS'"
        exit 1
      fi
      echo "OK: conversion service namespace = $SVC_NS"

      # 3. caBundle non-empty — cert-manager injected (OSPRH-30208, async)
      CA=$(oc get crd $CRD -o jsonpath='{.spec.conversion.webhook.clientConfig.caBundle}')
      if [ -z "$CA" ]; then
        echo "FAIL: caBundle is empty — cert-manager has not injected yet"
        exit 1
      fi
      echo "OK: caBundle is non-empty (cert-manager injected)"
