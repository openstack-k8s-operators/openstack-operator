apiVersion: kuttl.dev/v1beta1
kind: TestAssert
# Phase-1 milestone gate for conversion webhook infrastructure.
# Step 02 already verified the CRD field namespaces and caBundle; this step
# focuses on the conversion round-trip: read a service API CR at each served
# version and assert key fields are equal (proves the webhook fires correctly).
#
# CONDITIONAL: Discovers any service operator CRD with v1beta2 support; skips
# gracefully if none found yet. Test activates automatically once any service
# operator adds v1beta2.
#
# Two namespaces in play:
#   INSTALL_NS — operator namespace where openstack-operator runs and writes
#                the CRD annotation/service.namespace (derived from operator deployment)
#   CR_NS      — kuttl test namespace where service API CRs are deployed by the
#                OpenStackControlPlane reconciler (= $NAMESPACE set by kuttl)
timeout: 120
commands:
  - script: |
      set -e

      INSTALL_NS=$(oc get deployment -A -l control-plane=controller-manager,app.kubernetes.io/name=openstack-operator -o jsonpath='{.items[0].metadata.namespace}')
      if [ -z "$INSTALL_NS" ]; then
        echo "FAIL: openstack-operator deployment not found — is the operator deployed?"; exit 1
      fi
      CR_NS="$NAMESPACE"

      # Discover service operator CRDs with v1beta2 support and webhook conversion
      # Pattern: <service>apis.<service>.openstack.org (keystoneapis, novaapis, etc.)
      CRD_JSON=$(oc get crds -o json) || {
        echo "FAIL: failed to retrieve CRDs"; exit 1
      }
      CANDIDATE_CRDS=$(echo "$CRD_JSON" | jq -r '
        .items[] |
        select(.metadata.name | test("^[a-z]+apis\\.[a-z]+\\.openstack\\.org$")) |
        select(.spec.versions | map(select(.name == "v1beta1" and .served)) | length > 0) |
        select(.spec.versions | map(select(.name == "v1beta2" and .served)) | length > 0) |
        select(.spec.conversion.strategy == "Webhook") |
        .metadata.name
      ')

      if [ -z "$CANDIDATE_CRDS" ]; then
        echo "SKIP: no service operator CRDs with v1beta2 support found yet"
        echo "      (test will activate automatically once any service operator adds v1beta2)"
        exit 0
      fi

      # Get OpenStackControlPlane CR to check which services are enabled
      CTLPLANE_CR=$(oc get openstackcontrolplane -n "$CR_NS" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
      if [ -z "$CTLPLANE_CR" ]; then
        echo "FAIL: no OpenStackControlPlane CR found in $CR_NS"
        exit 1
      fi

      # Test all CRDs that have v1beta2 support
      TESTED_COUNT=0
      for candidate in $CANDIDATE_CRDS; do
        API_GROUP=$(echo "$candidate" | cut -d. -f2-)
        RESOURCE=$(echo "$candidate" | cut -d. -f1)

        # Derive service name from CRD (e.g., keystoneapis.keystone.openstack.org -> keystone)
        SERVICE_NAME=$(echo "$candidate" | cut -d. -f2)

        # Check if service is enabled in OpenStackControlPlane
        # Empty/missing field means enabled (default), only explicit "false" means disabled
        SERVICE_ENABLED=$(oc get openstackcontrolplane "$CTLPLANE_CR" -n "$CR_NS" \
          -o jsonpath="{.spec.$SERVICE_NAME.enabled}" 2>/dev/null || echo "true")
        # Treat empty as enabled (matches API defaulting)
        [ -z "$SERVICE_ENABLED" ] && SERVICE_ENABLED="true"

        CR_NAME=$(oc get "$candidate" -n "$CR_NS" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

        if [ -z "$CR_NAME" ]; then
          if [ "$SERVICE_ENABLED" = "false" ]; then
            echo "SKIP: $candidate has v1beta2, but $SERVICE_NAME is disabled (no CR expected)"
            continue
          else
            echo "FAIL: $candidate has v1beta2 and $SERVICE_NAME is enabled, but no CR instance found"
            exit 1
          fi
        fi
        echo "Testing conversion webhook with $candidate (CR: $CR_NAME)"

        # Read at v1beta2 (storage version — no conversion needed; proves CRD is installed)
        oc get --raw \
          "/apis/$API_GROUP/v1beta2/namespaces/$CR_NS/$RESOURCE/$CR_NAME" \
          | jq -e '.spec' > /dev/null || {
          echo "FAIL: $candidate v1beta2 read failed or spec missing (CRD install/conversion issue)"
          exit 1
        }
        echo "OK: $candidate v1beta2 read succeeded"

        # Read at v1beta1 (legacy version — fires conversion webhook: v1beta2 storage -> v1beta1)
        oc get --raw \
          "/apis/$API_GROUP/v1beta1/namespaces/$CR_NS/$RESOURCE/$CR_NAME" \
          | jq -e '.spec' > /dev/null || {
          echo "FAIL: $candidate v1beta1 read failed or spec missing (conversion webhook not reachable)"
          exit 1
        }
        echo "OK: $candidate v1beta1 read succeeded (conversion webhook is reachable)"

        # Phase-1 milestone: verify both API versions are readable (proves webhook infrastructure works).
        # We do NOT assert spec equality — once service operators implement non-trivial conversion
        # (renamed/restructured fields), v1beta1 and v1beta2 specs will legitimately differ.
        # Full conversion correctness tests belong in service operator repos.
        TESTED_COUNT=$((TESTED_COUNT + 1))
      done

      if [ "$TESTED_COUNT" -eq 0 ]; then
        echo "SKIP: found CRDs with v1beta2 support, but all services are disabled (no CR instances to test)"
        exit 0
      fi

      echo "PASS: conversion webhook Phase-1 milestone gate complete ($TESTED_COUNT service(s) tested)"
