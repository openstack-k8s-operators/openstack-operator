  names:
    kind: PodRemediator
    listKind: PodRemediatorList
    plural: podremediators
    singular: podremediator
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
