    - description: Message
      jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          PodRemediator is the Schema for the podremediators API.
          When present, the controller watches worker nodes and PVCs in spec.namespaces
          (or only the CR's namespace when the field is empty). When NHC/SNR mark a node
          for remediation, it deletes eligible PVCs so workloads can respawn.
          NHC and SNR must be installed and configured; otherwise the controller sets ReadyCondition False.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodRemediatorSpec defines the desired state of PodRemediator
            properties:
              consentPollInterval:
                description: |-
                  ConsentPollInterval controls how often the controller re-checks PVCs waiting
                  for SNR fencing confirmation or app-operator safe-to-delete consent.
                  Lower values reduce recovery latency; higher values reduce
                  API load. Overrides the PODREMEDIATOR_CONSENT_POLL_INTERVAL env var.
                  Format: Go duration string, e.g. "2m", "90s". Default: "2m".
                type: string
                x-kubernetes-validations:
                - message: must be a valid duration of at least 1s
                  rule: duration(self) >= duration('1s')
              disabled:
                default: false
                description: |-
                  Disabled stops annotation and deletion and clears pending remediation consent.
                  Default false: applying the CR enables PVC remediation when NHC/SNR are present; set disabled to true to turn it off.
                type: boolean
              namespaces:
                description: |-
                  Namespaces lists the namespaces where this PodRemediator scans eligible
                  PVCs and may remediate those PVCs and their associated Pods. If empty, it
                  uses the namespace containing this CR. Node health and SNR fencing events
                  remain cluster-wide; this setting only scopes PVC processing.
                  The effective namespace scope is immutable after CR creation. Delete and
                  recreate the CR to change its scope; deletion cleanup clears pending
                  handshakes in the configured namespaces.
                items:
                  minLength: 1
                  type: string
                type: array
                x-kubernetes-list-type: set
              periodicPollInterval:
                description: |-
                  PeriodicPollInterval is the safety-net requeue interval when the controller
                  is idle (no unhealthy nodes, disabled, or NHC/SNR missing). Guarantees the
                  controller re-evaluates node health after a pod restart when nodes are already
                  NotReady and no node-transition event fires. Overrides the
                  PODREMEDIATOR_PERIODIC_POLL_INTERVAL env var.
                  Format: Go duration string, e.g. "5m", "2m". Default: "5m".
                type: string
                x-kubernetes-validations:
                - message: must be a valid duration of at least 1s
                  rule: duration(self) >= duration('1s')
              remediationPaused:
                default: false
                description: |-
                  RemediationPaused keeps detecting and tagging stuck PVCs but prevents new PVC and Pod deletion transactions.
                  Pending requests and consent are retained and revalidated when remediation resumes.
                  Deletions already in progress or past the durable commit boundary continue to completion.
                type: boolean
            type: object
          status:
            description: PodRemediatorStatus defines the observed state of PodRemediator
            properties:
              conditions:
                description: Conditions
                items:
                  description: Condition defines an observation of a API resource
                    operational state.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed. If that is not known, then using the time when
                        the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition
                        in CamelCase.
                      type: string
                    severity:
                      description: |-
                        Severity provides a classification of Reason code, so the current situation is immediately
                        understandable and could act accordingly.
                        It is meant for situations where Status=False and it should be indicated if it is just
                        informational, warning (next reconciliation might fix it) or an error (e.g. DB create issue
                        and no actions to automatically resolve the issue can/should be done).
                        For conditions where Status=Unknown or Status=True the Severity should be SeverityNone.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type of condition in CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation successfully
                  reconciled by the controller.
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: namespace scope cannot be changed after creation; delete and recreate
            the PodRemediator
          rule: (has(self.spec) && has(self.spec.namespaces) && size(self.spec.namespaces)
            > 0) == (has(oldSelf.spec) && has(oldSelf.spec.namespaces) && size(oldSelf.spec.namespaces)
            > 0) && (!(has(self.spec) && has(self.spec.namespaces) && size(self.spec.namespaces)
            > 0) || self.spec.namespaces == oldSelf.spec.namespaces)
    served: true
    storage: true
    subresources:
      status: {}
